<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사은품</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#f5f5f1;--panel:#fff;--ink:#171814;--muted:#777970;--line:#dedfd8;--lime:#dfff43;--dark:#20221d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px Pretendard,"Noto Sans KR",Arial,sans-serif;letter-spacing:-.2px}
.top{height:58px;padding:0 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(245,245,241,.96);border-bottom:1px solid var(--line)}
.logo{width:31px;height:31px;border-radius:9px;background:var(--dark);color:var(--lime);display:grid;place-items:center;font-weight:950}
.top b{font-size:14px}.top small{font-size:9px;color:var(--muted);display:block;letter-spacing:.4px}
main{padding:16px;max-width:520px}
.step{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}.step b{font-size:12px}
.num{font-size:9px;border-radius:99px;background:#e7e8e2;color:#85877e;padding:3px 7px;letter-spacing:.6px}
.imgbox{margin-top:8px;border:1px dashed #bfc1b8;border-radius:14px;background:#fbfbf8 center/contain no-repeat;min-height:150px;display:grid;place-items:center;cursor:pointer;color:#a9aba2;font-size:13px;text-align:center;padding:12px;line-height:1.5}
.imgbox.has{border-style:solid;border-color:#cfd1c9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row .lb{width:64px;color:#5b5d54;font-weight:700}
.row .v{width:40px;text-align:right;font-weight:700;color:#5b5d54}
label.chk{display:flex;align-items:center;gap:8px;font-weight:700;color:#4f5148;cursor:pointer}
label.chk input{width:16px;height:16px}
input[type=range]{flex:1}
input[type=color]{width:38px;height:32px;border:1px solid #cfd1c9;border-radius:8px;background:#fff;cursor:pointer}
input[type=text]{flex:1;border:1px solid #cfd1c9;border-radius:10px;background:#fff;padding:9px 10px;font:inherit;outline:none}
.ghost{border:1px solid #cfd1c9;background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;color:#4f5148}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.55}
.primary{width:100%;margin-top:18px;border:0;border-radius:12px;background:var(--dark);color:#fff;padding:14px;font-weight:850;cursor:pointer;box-shadow:0 8px 20px rgba(30,32,27,.14)}
.status{display:none;margin-top:12px;padding:10px;border-radius:10px;background:#efffb7;color:#39430f;font-size:11px;line-height:1.45}.status.show{display:block}
.status.err{background:#ffe1dc;color:#7a2318}
.preview-shell{background:#d9dbd4;border-radius:14px;padding:8px;margin-top:14px}
.preview-shell svg{width:100%;height:auto;max-width:100%;display:block;background:#fff;border-radius:8px}
</style>
</head>
<body>
<header class="top"><div class="logo">+</div><div><b>사은품</b><small>상품 썸네일 우측 하단에 ＋사은품 배지 자동 삽입</small></div></header>
<main>
  <div class="step"><b>상품 썸네일</b><span class="num">01 THUMB</span></div>
  <label class="imgbox" id="imgBox"><input type="file" id="imgInput" accept="image/*" hidden><span id="imgHint">＋ 클릭 업로드 · 브랜드스토어/다나와 이미지를 여기로 드래그<br><span style="font-size:11px">이미지 복사 후 Ctrl+V 붙여넣기도 됩니다</span></span></label>
  <div class="row"><input type="text" id="urlIn" placeholder="이미지 주소 붙여넣기 (shop-phinf.pstatic.net/…)"><button class="ghost" id="urlBtn">불러오기</button></div>
  <div class="hint">네이버 이미지는 <b>?type=…</b> 축소 파라미터를 떼고 원본 해상도로 받아옵니다.</div>

  <div class="step"><b>사은품 이미지 (한 번 넣으면 기억)</b><span class="num">02 GIFT</span></div>
  <label class="imgbox" id="giftBox" style="min-height:110px"><input type="file" id="giftInput" accept="image/*" hidden><span id="giftHint">＋ 사은품 사진 업로드 · 드래그<br><span style="font-size:11px">흰 배경 사진이면 그대로 원 안에 맞춰 들어갑니다</span></span></label>
  <div class="row"><span class="lb">사은품 크기</span><input type="range" id="giftFill" min="0.5" max="1.3" step="0.02" value="0.9"><span class="v" id="giftFillV">90%</span></div>
  <div class="row"><span class="lb">사은품 위치</span><input type="range" id="giftDx" min="-0.4" max="0.4" step="0.01" value="0"><input type="range" id="giftDy" min="-0.4" max="0.4" step="0.01" value="0"></div>
  <div class="row"><button class="ghost" id="giftClear">사은품 이미지 지우기</button></div>

  <div class="step"><b>배지 위치 · 크기</b><span class="num">03 BADGE</span></div>
  <div class="row"><span class="lb">원 크기</span><input type="range" id="bScale" min="0.6" max="1.6" step="0.02" value="1"><span class="v" id="bScaleV">100%</span></div>
  <div class="row"><span class="lb">가로</span><input type="range" id="bX" min="-0.25" max="0.12" step="0.005" value="0"></div>
  <div class="row"><span class="lb">세로</span><input type="range" id="bY" min="-0.25" max="0.12" step="0.005" value="0"></div>
  <div class="row"><label class="chk"><input type="checkbox" id="plusOn" checked> ＋ 표시</label><input type="color" id="plusColor" value="#111111"><label class="chk" style="margin-left:10px"><input type="checkbox" id="shadowOn" checked> 그림자</label></div>
  <div class="row"><button class="ghost" id="resetBtn">배지 기본값</button></div>

  <button class="primary" id="saveBtn">제작</button>
  <div id="status" class="status"></div>
  <div class="preview-shell" id="preview"></div>
</main>

<script src="image-drop.js"></script>
<script>
"use strict";
const inFrame = window.parent !== window;
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n*100)/100;
function setStatus(t, err){ const x=$('#status'); x.textContent=t; x.className='status show'+(err?' err':''); }

/* 배지 기본 배치 — 예시(578px 썸네일) 실측을 짧은 변 S 기준 비율로:
   원 중심 (0.83, 0.813)·반지름 0.17, ＋는 원의 좌상단(중심에서 -0.81r, -0.61r) */
const DEF = { cx:0.83, cy:0.813, r:0.17, plusDx:-0.82, plusDy:-0.62, plusSize:0.034 };
const LS_GIFT = 'gift.img', LS_OPT = 'gift.opt';

const state = { img:'', imgW:0, imgH:0, name:'',
  gift:'', giftW:0, giftH:0, giftEl:null,
  giftFill:0.9, giftDx:0, giftDy:0,
  bScale:1, bX:0, bY:0, plusOn:true, plusColor:'#111111', shadowOn:true,
  badge:'', badgeKey:'' };

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/* 원형 배지(흰 원 + 그 안에 사은품)를 캔버스로 구워 투명 PNG로 — clipPath 없이도 에디터에서 그대로 보인다 */
function bakeBadge(px){
  const key = [px, state.gift.length, state.giftFill, state.giftDx, state.giftDy, state.shadowOn].join('|');
  if(state.badgeKey===key) return state.badge;
  const pad = Math.round(px*0.12), size = px + pad*2;
  const c = document.createElement('canvas'); c.width=size; c.height=size;
  const g = c.getContext('2d'), R = px/2, C = size/2;
  if(state.shadowOn){
    g.save(); g.shadowColor='rgba(0,0,0,.22)'; g.shadowBlur=px*0.07; g.shadowOffsetY=px*0.02;
    g.beginPath(); g.arc(C,C,R,0,Math.PI*2); g.fillStyle='#fff'; g.fill(); g.restore();
  }
  g.beginPath(); g.arc(C,C,R,0,Math.PI*2); g.fillStyle='#fff'; g.fill();
  if(state.giftEl){
    g.save(); g.beginPath(); g.arc(C,C,R-1,0,Math.PI*2); g.clip();
    const box = px*state.giftFill, ar = state.giftW/state.giftH;
    const w = ar>=1 ? box : box*ar, h = ar>=1 ? box/ar : box;
    g.imageSmoothingQuality='high';
    g.drawImage(state.giftEl, C - w/2 + state.giftDx*px, C - h/2 + state.giftDy*px, w, h);
    g.restore();
  }
  state.badge = c.toDataURL('image/png'); state.badgeKey = key;
  state.badgePad = pad/px;
  return state.badge;
}

function geom(W,H){
  const S = Math.min(W,H), r = DEF.r*S*state.bScale;
  const cx = W*DEF.cx + state.bX*S, cy = H - (1-DEF.cy)*S + state.bY*S;   // 아래·오른쪽 가장자리 기준으로 붙인다
  return { S, r, cx, cy };
}

function plusSVG(x,y,s,color){
  const t = s*0.36;   // 획 두께
  const R = s*0.95;   // ＋ 뒤 흰 동그라미 반지름
  const disc = (state.shadowOn
      ? `<circle cx="${fmt(x)}" cy="${fmt(y+R*0.06)}" r="${fmt(R*1.1)}" fill="#000000" fill-opacity="0.06"/>`+
        `<circle cx="${fmt(x)}" cy="${fmt(y+R*0.04)}" r="${fmt(R*1.04)}" fill="#000000" fill-opacity="0.08"/>`
      : '') + `<circle cx="${fmt(x)}" cy="${fmt(y)}" r="${fmt(R)}" fill="#ffffff"/>`;
  return disc + `<path d="M${fmt(x-t/2)} ${fmt(y-s/2)}h${fmt(t)}v${fmt(s/2-t/2)}h${fmt(s/2-t/2)}v${fmt(t)}h${fmt(-(s/2-t/2))}v${fmt(s/2-t/2)}h${fmt(-t)}v${fmt(-(s/2-t/2))}h${fmt(-(s/2-t/2))}v${fmt(-t)}h${fmt(s/2-t/2)}z" fill="${color}"/>`;
}

function buildSVG(){
  const W = 1000, H = state.img ? Math.round(1000*state.imgH/state.imgW) : 1000;
  const body = [`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`];
  if(state.img) body.push(`<image href="${state.img}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet"/>`);
  else {
    body.push(`<rect x="60" y="60" width="${W-120}" height="${H-120}" rx="20" fill="none" stroke="#c9cdd6" stroke-width="3" stroke-dasharray="16 14"/>`);
    body.push(`<text x="${W/2}" y="${H/2-40}" font-family="Pretendard, sans-serif" font-size="34" font-weight="700" fill="#9aa2b4" text-anchor="middle" dominant-baseline="central">상품 썸네일을 드롭하세요</text>`);
  }
  const { S, r, cx, cy } = geom(W,H);
  const px = Math.round(r*2*2);               // 2배 해상도로 굽기
  const badge = bakeBadge(px), padR = state.badgePad*2*r;
  body.push(`<image href="${badge}" x="${fmt(cx-r-padR)}" y="${fmt(cy-r-padR)}" width="${fmt(2*r+2*padR)}" height="${fmt(2*r+2*padR)}" preserveAspectRatio="xMidYMid meet"/>`);
  if(!state.gift) body.push(`<text x="${fmt(cx)}" y="${fmt(cy)}" font-family="Pretendard, sans-serif" font-size="${fmt(r*0.16)}" font-weight="700" fill="#9aa2b4" text-anchor="middle" dominant-baseline="central">사은품 이미지</text>`);
  if(state.plusOn) body.push(plusSVG(cx + DEF.plusDx*r, cy + DEF.plusDy*r, DEF.plusSize*S*state.bScale, state.plusColor));
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${body.join('')}</svg>`;
}
function render(){ $('#preview').innerHTML = buildSVG(); }

/* 썸네일 — 원본 바이트를 그대로 data URI로(재인코딩 없이 화질 유지) */
function readImage(file){
  if(!file || !/^image\//.test(file.type)){ setStatus('이미지 파일이 아니에요.', true); return; }
  const r = new FileReader();
  r.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      state.img=r.result; state.imgW=im.naturalWidth; state.imgH=im.naturalHeight;
      state.name=(file.name||'thumb').replace(/\.[a-z0-9]+$/i,'');
      const box=$('#imgBox'); box.classList.add('has'); box.style.backgroundImage=`url("${r.result}")`;
      $('#imgHint').style.display='none';
      setStatus(`썸네일 ${im.naturalWidth}×${im.naturalHeight} 적용됨`+(im.naturalWidth<1000?' — 1000px보다 작아 확대됩니다(원본 해상도 확인)':''));
      render();
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

/* 사은품 — 흰/투명 여백을 잘라 원 안에 꽉 차게, 최대 900px로 줄여 브라우저에 기억 */
function loadGift(dataUrl, save){
  const im = new Image();
  im.onload = ()=>{
    const sc = Math.min(1, 900/Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1,Math.round(im.naturalWidth*sc)), h = Math.max(1,Math.round(im.naturalHeight*sc));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
    const d=g.getImageData(0,0,w,h).data;
    let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(d[i]<238||d[i+1]<238||d[i+2]<238){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
    let out=c;
    if(x1>x0 && y1>y0){
      const cw=x1-x0+1, ch=y1-y0+1; out=document.createElement('canvas'); out.width=cw; out.height=ch;
      const og=out.getContext('2d'); og.fillStyle='#fff'; og.fillRect(0,0,cw,ch); og.drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
    }
    const url = out.toDataURL('image/jpeg', 0.92);
    const el = new Image();
    el.onload = ()=>{
      state.gift=url; state.giftEl=el; state.giftW=el.naturalWidth; state.giftH=el.naturalHeight; state.badgeKey='';
      const box=$('#giftBox'); box.classList.add('has'); box.style.backgroundImage=`url("${url}")`; $('#giftHint').style.display='none';
      if(save) setStatus(lsSet(LS_GIFT, url) ? '사은품 이미지를 저장했어요. 다음부터 자동으로 들어갑니다.' : '사은품 이미지는 적용됐지만 브라우저 저장에 실패했어요.', false);
      render();
    };
    el.src=url;
  };
  im.src=dataUrl;
}
function readGift(file){
  if(!file || !/^image\//.test(file.type)){ setStatus('이미지 파일이 아니에요.', true); return; }
  const r=new FileReader(); r.onload=()=>loadGift(r.result, true); r.readAsDataURL(file);
}

/* 주소/붙여넣기 — 네이버 shop-phinf 는 ?type= 를 떼면 원본 */
function cleanNaver(u){ return /pstatic\.net\//i.test(u) ? u.split('?')[0] : u; }
async function loadUrl(u, target){
  u = (u||'').trim(); if(!/^https?:\/\//.test(u)){ setStatus('http로 시작하는 이미지 주소를 넣어주세요.', true); return; }
  setStatus('이미지를 가져오는 중…');
  try{ const f = await ImageDrop.urlToFile(cleanNaver(u)); target==='gift' ? readGift(f) : readImage(f); }
  catch(e){ setStatus('이미지를 가져오지 못했어요. 이미지를 저장해 파일로 올려주세요.', true); }
}
document.addEventListener('paste', e=>{
  if(e.target && e.target.tagName==='INPUT' && e.target.type==='text') return;   // 주소칸 입력은 그대로
  const items=[...(e.clipboardData&&e.clipboardData.items||[])];
  const it=items.find(i=>/^image\//.test(i.type));
  if(it){ e.preventDefault(); readImage(it.getAsFile()); return; }
  const t=e.clipboardData&&e.clipboardData.getData('text/plain');
  if(t && /^https?:\/\//.test(t.trim())){ e.preventDefault(); loadUrl(t,'img'); }
});

/* 옵션 기억 */
const OPT_KEYS=['giftFill','giftDx','giftDy','bScale','bX','bY','plusOn','plusColor','shadowOn'];
function saveOpt(){ const o={}; OPT_KEYS.forEach(k=>o[k]=state[k]); lsSet(LS_OPT, JSON.stringify(o)); }
function syncUI(){
  $('#giftFill').value=state.giftFill; $('#giftFillV').textContent=Math.round(state.giftFill*100)+'%';
  $('#giftDx').value=state.giftDx; $('#giftDy').value=state.giftDy;
  $('#bScale').value=state.bScale; $('#bScaleV').textContent=Math.round(state.bScale*100)+'%';
  $('#bX').value=state.bX; $('#bY').value=state.bY;
  $('#plusOn').checked=state.plusOn; $('#plusColor').value=state.plusColor; $('#shadowOn').checked=state.shadowOn;
}
function bindRange(id, key, label){
  $('#'+id).addEventListener('input', e=>{ state[key]=parseFloat(e.target.value); if(label) $('#'+label).textContent=Math.round(state[key]*100)+'%'; state.badgeKey=''; render(); saveOpt(); });
}
bindRange('giftFill','giftFill','giftFillV'); bindRange('giftDx','giftDx'); bindRange('giftDy','giftDy');
bindRange('bScale','bScale','bScaleV'); bindRange('bX','bX'); bindRange('bY','bY');
$('#plusOn').addEventListener('change', e=>{ state.plusOn=e.target.checked; render(); saveOpt(); });
$('#plusColor').addEventListener('input', e=>{ state.plusColor=e.target.value; render(); saveOpt(); });
$('#shadowOn').addEventListener('change', e=>{ state.shadowOn=e.target.checked; state.badgeKey=''; render(); saveOpt(); });
$('#resetBtn').onclick=()=>{ Object.assign(state,{bScale:1,bX:0,bY:0,plusOn:true,plusColor:'#111111',shadowOn:true,giftFill:0.9,giftDx:0,giftDy:0}); state.badgeKey=''; syncUI(); render(); saveOpt(); };
$('#giftClear').onclick=()=>{ state.gift=''; state.giftEl=null; state.badgeKey=''; try{localStorage.removeItem(LS_GIFT);}catch(e){}
  const b=$('#giftBox'); b.classList.remove('has'); b.style.backgroundImage=''; $('#giftHint').style.display=''; render(); };

$('#imgInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readImage(f); e.target.value=''; });
$('#giftInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readGift(f); e.target.value=''; });
$('#urlBtn').onclick=()=>loadUrl($('#urlIn').value,'img');
$('#urlIn').addEventListener('keydown', e=>{ if(e.key==='Enter') loadUrl($('#urlIn').value,'img'); });

function outputSVG(filename, svg){
  if(inFrame) parent.postMessage({ pluginMessage:{ type:'save-svg', filename, svg } }, '*');
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1200); }
}
$('#saveBtn').textContent = inFrame ? '제작 → 에디터로 보내기' : '제작 → SVG 저장';
$('#saveBtn').onclick=()=>{
  if(!state.img){ setStatus('상품 썸네일을 먼저 넣어주세요.', true); return; }
  if(!state.gift) setStatus('사은품 이미지 없이 빈 원으로 만들었어요.', true);
  outputSVG((state.name||'product')+'-gift.svg', buildSVG());
  if(state.gift) setStatus(inFrame ? '에디터로 보냈어요.' : 'SVG를 저장했어요.');
};
window.addEventListener('message', e=>{ const m=e.data&&e.data.pluginMessage; if(m&&(m.type==='toast'||m.type==='error')) setStatus(m.message, m.type==='error'); });

/* 드래그&드롭 — 네이버 이미지의 축소 파라미터 제거는 공용 헬퍼(image-drop.js cleanUrl)가 처리 */
window.addEventListener('load', ()=>{
  if(!window.ImageDrop) return;
  ImageDrop.wire('imgInput', ['#imgBox','#preview'], setStatus);
  ImageDrop.wire('giftInput', ['#giftBox'], setStatus);
});

/* 시작: 저장된 옵션·사은품 복원 */
try{ const o=JSON.parse(lsGet(LS_OPT)||'null'); if(o) OPT_KEYS.forEach(k=>{ if(o[k]!==undefined) state[k]=o[k]; }); }catch(e){}
syncUI();
const savedGift = lsGet(LS_GIFT);
if(savedGift) loadGift(savedGift, false);
render();
</script>
</body>
</html>
