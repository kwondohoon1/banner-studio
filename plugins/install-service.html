<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설치배송 배너</title>
<style>
:root{--bg:#f5f5f1;--ink:#171814;--muted:#777970;--line:#dedfd8;--lime:#dfff43;--dark:#20221d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px Pretendard,"Noto Sans KR",Arial,sans-serif;letter-spacing:-.2px}
.top{height:58px;padding:0 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(245,245,241,.96);border-bottom:1px solid var(--line)}
.logo{width:31px;height:31px;border-radius:9px;background:var(--dark);color:var(--lime);display:grid;place-items:center;font-weight:950}
main{padding:16px;max-width:520px;margin:0 auto}
.step{margin:17px 0 8px;display:flex;justify-content:space-between;align-items:center}
.step b{font-size:12px}
.num{font-size:9px;border-radius:99px;background:#e7e8e2;color:#85877e;padding:3px 7px;letter-spacing:.6px}
input[type=text],textarea,select{width:100%;border:1px solid #cfd1c9;border-radius:12px;background:#fff;padding:10px 12px;font:inherit;outline:none}
textarea{resize:vertical;line-height:1.5}
input[type=range]{accent-color:var(--dark);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:8px}
.field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px}
.colorfield{display:flex;align-items:center;gap:8px;border:1px solid #cfd1c9;border-radius:12px;padding:6px 10px;background:#fff}
.colorfield input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.colorfield span{font-size:10.5px;color:var(--muted)}
.primary{width:100%;border:0;border-radius:12px;background:var(--dark);color:#fff;padding:13px;font-weight:850;cursor:pointer;margin-top:6px}
.ghost{border:1px solid #cfd1c9;background:#fff;border-radius:10px;padding:8px 10px;font:inherit;cursor:pointer;font-size:11px}
.preview-shell{background:#d9dbd4;border-radius:14px;padding:8px;margin-top:14px}
.preview-shell svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.status{display:none;margin-top:12px;padding:10px;border-radius:10px;background:#efffb7;color:#39430f;font-size:11px}
.status.show{display:block}
.card{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.card-head b{font-size:11px}
.drop{border:1.5px dashed #c9cbc0;border-radius:12px;background:#fbfbf9;padding:10px;text-align:center;cursor:pointer}
.drop.dragover{border-color:var(--dark);background:#f0f1ea}
.drop img{max-width:100%;max-height:96px;border-radius:8px;display:block;margin:0 auto}
.drop .hint{font-size:10.5px;color:var(--muted);padding:12px 4px}
.hidden-file{display:none}
.small-btn-row{display:flex;gap:6px;margin-top:6px}
.sub-note{font-size:10px;color:var(--muted);margin:2px 0 8px;line-height:1.5}
</style>
</head>
<body>
<header class="top"><div class="logo">IS</div><b>설치배송 배너</b> <span class="num">860 · 데스크탑/모니터 겸용</span></header>
<main>

  <div class="step"><b>1. 컬러</b><span class="num">01</span></div>
  <div class="row2">
    <div class="colorfield"><input type="color" id="accent" value="#1B64DA"><span>포인트 블루</span></div>
    <div class="colorfield"><input type="color" id="ink" value="#111111"><span>기본 글자색</span></div>
  </div>

  <div class="step"><b>2. 히어로</b><span class="num">02</span></div>
  <div class="field"><label>타이틀 1줄 (검정)</label><input type="text" id="title1" value="한성 49인치 모니터"></div>
  <div class="field"><label>타이틀 2줄 (파랑)</label><input type="text" id="title2" value="설치 서비스 진행"></div>
  <div class="field"><label>서브카피 1줄</label><input type="text" id="sub1" value="49인치 대형 모니터,"></div>
  <div class="field"><label>서브카피 2줄 — *별표*로 감싸면 파란 강조</label><input type="text" id="sub2" value="더욱 *안전하고 편리하게* 설치하세요."></div>
  <div class="row2">
    <div class="field"><label>배지 1 (📍)</label><input type="text" id="badge1" value="서울 한정"></div>
    <div class="field"><label>배지 2 (👤)</label><input type="text" id="badge2" value="슈퍼스토어 구매 고객 대상"></div>
  </div>
  <div class="field"><label>히어로 이미지 (기사님/제품 사진)</label>
    <div class="drop" id="heroDrop"><div class="hint">클릭 또는 이미지 드래그 (웹 이미지 지원)</div></div>
    <input class="hidden-file" type="file" id="heroFile" accept="image/*">
    <div class="small-btn-row"><button type="button" class="ghost" id="heroClear">이미지 제거</button></div>
  </div>
  <div class="field"><label>히어로 이미지 크기 <span id="heroScaleVal">100%</span></label><input type="range" id="heroScale" min="0.6" max="1.6" step="0.02" value="1"></div>

  <div class="step"><b>3. 구매 방법 안내</b><span class="num">03</span></div>
  <div class="field"><label>섹션 제목</label><input type="text" id="buyTitle" value="설치 서비스는 이렇게 구매해주세요!"></div>
  <div class="field"><label>안내 문장 — '따옴표'는 자동 파랑</label><textarea id="guide" style="height:56px">설치 서비스를 원하시는 고객님은 상품 구매 시 '추가 구성품 선택'에서 '설치서비스(서울)' 옵션을 선택 후 구매해주세요.</textarea></div>
  <div class="field"><label>상품 예시 이미지</label>
    <div class="drop" id="prodDrop"><div class="hint">클릭 또는 이미지 드래그</div></div>
    <input class="hidden-file" type="file" id="prodFile" accept="image/*">
    <div class="small-btn-row"><button type="button" class="ghost" id="prodClear">이미지 제거</button></div>
  </div>
  <div class="field"><label>상품명</label><input type="text" id="prodName" value="한성 49인치 모니터"></div>
  <div class="field"><label>옵션 드롭다운 행 (줄바꿈 구분 · 마지막 행이 펼쳐진 상태)</label><textarea id="optRows" style="height:56px">추가 구성품 선택
모니터케이블
설치서비스</textarea></div>
  <div class="row2">
    <div class="field"><label>강조 옵션명</label><input type="text" id="optName" value="설치서비스(서울)"></div>
    <div class="field"><label>가격</label><input type="text" id="optPrice" value="0원"></div>
  </div>
  <div class="field"><label>하단 안내바 — *별표* 파랑 강조</label><input type="text" id="infoBar" value="설치서비스 옵션을 선택하지 않을 경우, *일반 택배 배송*으로 *출고*됩니다."></div>

  <div class="step"><b>4. 진행 절차</b><span class="num">04</span></div>
  <div class="sub-note">아이콘은 에디터 로고·아이콘 패널과 같은 Iconify에서 가져옵니다. 아이콘 ID를 바꾸거나(예: tabler:truck, mdi:tools) 이미지를 직접 올릴 수 있습니다.</div>
  <div id="stepEditors"></div>

  <div class="step"><b>5. 유의사항</b><span class="num">05</span></div>
  <textarea id="notice" style="height:96px">한성컴퓨터 슈퍼스토어 주문 한정으로 진행되는 시범서비스 입니다.
서울 지역 한정으로 운영되며 서울 외 지역 주문의 경우 별도 안내 없이 택배 출고 됩니다.
주말 및 공휴일에는 설치 서비스 진행이 불가합니다.
설치 후 스티로폼 박스 등 포장재는 수거하지 않습니다.</textarea>

  <button class="primary" id="saveBtn">SVG 다운로드</button>
  <div id="status" class="status"></div>
  <div class="preview-shell" id="preview"></div>
</main>

<script>
'use strict';
const inFrame=window.parent!==window;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setStatus(t,e){const x=$('#status');x.textContent=t;x.className='status'+(t?' show':'');x.style.background=e?'#ffe2df':''}

/* ---------- 텍스트 측정/줄바꿈 ---------- */
const _mc=document.createElement('canvas').getContext('2d');
function tw(t,size,weight){_mc.font=`${weight||400} ${size}px Pretendard, sans-serif`;return _mc.measureText(String(t)).width}
function wrap(text,size,weight,maxW){const words=String(text).split(/\s+/).filter(Boolean),out=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(tw(t,size,weight)<=maxW)cur=t;else{if(cur)out.push(cur);cur=w}}
 if(cur)out.push(cur);return out.length?out:['']}

/* ---------- 이미지 헬퍼 (드롭/웹 이미지) ---------- */
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function urlToDataURL(url){
 try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw 0;return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;r.blob().then(b=>fr.readAsDataURL(b))})}
 catch(e){const p='https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''));const r2=await fetch(p);const b=await r2.blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}}
function wireDrop(el,onData){
 el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});
 el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
 el.addEventListener('drop',async e=>{e.preventDefault();el.classList.remove('dragover');
  if(e.dataTransfer.files&&e.dataTransfer.files.length){try{onData(await fileToDataURL(e.dataTransfer.files[0]))}catch(err){setStatus('이미지를 불러오지 못했습니다',true)}return}
  let url=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');
  if(!url){const h=e.dataTransfer.getData('text/html');if(h){const m=h.match(/src="([^"]+)"/);if(m)url=m[1]}}
  if(url){setStatus('이미지 불러오는 중…');try{onData(await urlToDataURL(url));setStatus('이미지 삽입 완료')}catch(err){setStatus('외부 이미지를 불러오지 못했습니다 (CORS)',true)}}})}

/* ---------- Iconify 아이콘 (에디터 로고·아이콘 패널과 동일 소스) ---------- */
const iconCache=new Map();
async function iconDataURL(id,color){const key=id+'|'+color;
 if(iconCache.has(key))return iconCache.get(key);
 const p=id.split(':');if(p.length!==2)throw new Error('bad id');
 const url=`https://api.iconify.design/${p[0]}/${p[1]}.svg?height=240&color=${encodeURIComponent(color)}`;
 const txt=await (await fetch(url)).text();
 if(!/<svg/i.test(txt))throw new Error('not svg');
 const d='data:image/svg+xml,'+encodeURIComponent(txt);
 iconCache.set(key,d);return d}
/* 렌더 시점에 준비된 아이콘만 그리고, 없으면 백그라운드 로드 후 재렌더 */
function iconReady(id,color){return iconCache.get(id+'|'+color)||null}
let _iconT=null;
function ensureIcons(list){list.forEach(([id,color])=>{if(!id||iconCache.has(id+'|'+color))return;
 iconCache.set(id+'|'+color,null); /* 로딩 중복 방지 */
 iconDataURL0(id,color).then(d=>{iconCache.set(id+'|'+color,d);clearTimeout(_iconT);_iconT=setTimeout(render,120)}).catch(()=>{})})}
async function iconDataURL0(id,color){const p=id.split(':');
 const url=`https://api.iconify.design/${p[0]}/${p[1]}.svg?height=240&color=${encodeURIComponent(color)}`;
 const txt=await (await fetch(url)).text();
 if(!/<svg/i.test(txt))throw new Error('not svg');
 return 'data:image/svg+xml,'+encodeURIComponent(txt)}

/* ---------- 상태 ---------- */
const state={
 accent:'#1B64DA',ink:'#111111',
 title1:'한성 49인치 모니터',title2:'설치 서비스 진행',
 sub1:'49인치 대형 모니터,',sub2:'더욱 *안전하고 편리하게* 설치하세요.',
 badge1:'서울 한정',badge2:'슈퍼스토어 구매 고객 대상',
 heroImage:null,heroScale:1,
 buyTitle:'설치 서비스는 이렇게 구매해주세요!',
 guide:"설치 서비스를 원하시는 고객님은 상품 구매 시 '추가 구성품 선택'에서 '설치서비스(서울)' 옵션을 선택 후 구매해주세요.",
 prodImage:null,prodName:'한성 49인치 모니터',
 optRows:['추가 구성품 선택','모니터케이블','설치서비스'],
 optName:'설치서비스(서울)',optPrice:'0원',
 infoBar:'설치서비스 옵션을 선택하지 않을 경우, *일반 택배 배송*으로 *출고*됩니다.',
 steps:[
  {icon:'tabler:clipboard-check',img:null,title:'주문 확인',desc:'주문 내역 확인 후 설치 서비스가 접수됩니다.'},
  {icon:'tabler:headset',img:null,title:'기사님 배정\n(설치 일정 조율)',desc:'전문 기사님이 배정되며 전화 또는 문자로 설치 일정을 안내해 드립니다.'},
  {icon:'tabler:tools',img:null,title:'기사님 방문',desc:'약속된 일정에 맞춰 전문 기사님이 방문하여 설치를 진행합니다.'},
  {icon:'tabler:device-desktop-check',img:null,title:'설치 완료',desc:'설치 완료 후 정상 동작 확인까지 안내해 드립니다.'}],
 noticeLines:['한성컴퓨터 슈퍼스토어 주문 한정으로 진행되는 시범서비스 입니다.','서울 지역 한정으로 운영되며 서울 외 지역 주문의 경우 별도 안내 없이 택배 출고 됩니다.','주말 및 공휴일에는 설치 서비스 진행이 불가합니다.','설치 후 스티로폼 박스 등 포장재는 수거하지 않습니다.']
};

/* ---------- 입력 바인딩 ---------- */
function bind(id,key,fn){$(id).addEventListener('input',e=>{state[key]=fn?fn(e.target.value):e.target.value;render()})}
bind('#accent','accent');bind('#ink','ink');
bind('#title1','title1');bind('#title2','title2');bind('#sub1','sub1');bind('#sub2','sub2');
bind('#badge1','badge1');bind('#badge2','badge2');
bind('#buyTitle','buyTitle');bind('#guide','guide');
bind('#prodName','prodName');
bind('#optRows','optRows',v=>v.split('\n').map(x=>x.trim()).filter(Boolean));
bind('#optName','optName');bind('#optPrice','optPrice');bind('#infoBar','infoBar');
bind('#notice','noticeLines',v=>v.split('\n').map(x=>x.trim()).filter(Boolean));
$('#heroScale').addEventListener('input',e=>{state.heroScale=parseFloat(e.target.value);$('#heroScaleVal').textContent=Math.round(state.heroScale*100)+'%';render()});
function wireImage(dropId,fileId,clearId,key){
 const drop=$(dropId),file=$(fileId);
 function refresh(){drop.innerHTML=state[key]?`<img src="${state[key]}">`:`<div class="hint">클릭 또는 이미지 드래그 (웹 이미지 지원)</div>`}
 drop.addEventListener('click',()=>file.click());
 file.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;state[key]=await fileToDataURL(f);e.target.value='';refresh();render()});
 $(clearId).addEventListener('click',()=>{state[key]=null;refresh();render()});
 wireDrop(drop,d=>{state[key]=d;refresh();render()});
 refresh()}
wireImage('#heroDrop','#heroFile','#heroClear','heroImage');
wireImage('#prodDrop','#prodFile','#prodClear','prodImage');

/* ---------- 절차 단계 편집기 ---------- */
function renderStepEditors(){
 const wrapEl=$('#stepEditors');wrapEl.innerHTML='';
 state.steps.forEach((st,i)=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`
   <div class="card-head"><b>단계 ${String(i+1).padStart(2,'0')}</b></div>
   <div style="display:flex;gap:10px;align-items:flex-start;margin-top:6px">
    <div class="drop" data-role="icon" style="width:56px;height:56px;padding:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%">
     ${st.img?`<img style="border-radius:50%" src="${st.img}">`:`<div class="hint" style="padding:2px;font-size:9px">이미지<br>교체</div>`}
    </div>
    <div style="flex:1">
     <div class="field" style="margin-bottom:6px"><label>Iconify 아이콘 ID</label><input type="text" data-role="icon-id" value="${esc(st.icon)}"></div>
    </div>
   </div>
   <input class="hidden-file" type="file" accept="image/*" data-role="iconfile">
   <div class="field" style="margin-top:6px"><label>제목 (줄바꿈 = \\n)</label><input type="text" data-role="title" value="${esc(st.title.replace(/\n/g,'\\n'))}"></div>
   <div class="field"><label>설명</label><input type="text" data-role="desc" value="${esc(st.desc)}"></div>`;
  const dropEl=card.querySelector('[data-role="icon"]'),fileEl=card.querySelector('[data-role="iconfile"]');
  dropEl.addEventListener('click',()=>fileEl.click());
  fileEl.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;st.img=await fileToDataURL(f);renderStepEditors();render()});
  wireDrop(dropEl,d=>{st.img=d;renderStepEditors();render()});
  card.querySelector('[data-role="icon-id"]').addEventListener('input',e=>{st.icon=e.target.value.trim();st.img=null;render()});
  card.querySelector('[data-role="title"]').addEventListener('input',e=>{st.title=e.target.value.replace(/\\n/g,'\n');render()});
  card.querySelector('[data-role="desc"]').addEventListener('input',e=>{st.desc=e.target.value;render()});
  wrapEl.appendChild(card)});
}

/* ---------- SVG 프리미티브 ---------- */
const W=860,FONT="Pretendard, 'Noto Sans KR', sans-serif";
function T(x,y,text,o){o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.anchor||'start'}" dominant-baseline="central" font-family="${FONT}" font-size="${o.size||16}" font-weight="${o.weight||400}" fill="${o.fill||'#111'}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.opacity?` opacity="${o.opacity}"`:''}>${esc(text)}</text>`}
function R(x,y,w,h,r,fill,extra){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"${extra||''}/>`}
function C(cx,cy,r,fill,extra){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"${extra||''}/>`}
/* *별표* / '따옴표' 강조 → 세그먼트로 분해해 <text> 여러 개로 배치 (에디터에서 개별 편집 가능) */
function markSeg(text,marker){const re=marker==='quote'?/'([^']+)'/g:/\*([^*]+)\*/g;
 const out=[];let last=0,m;
 while((m=re.exec(text))){if(m.index>last)out.push({t:text.slice(last,m.index),hi:false});out.push({t:marker==='quote'?"'"+m[1]+"'":m[1],hi:true});last=m.index+m[0].length}
 if(last<text.length)out.push({t:text.slice(last),hi:false});
 return out.length?out:[{t:text,hi:false}]}
function segText(x,y,segs,size,o){o=o||{};let svg='',cx=x;
 const total=segs.reduce((a,s)=>a+tw(s.t,size,s.hi?(o.hiWeight||700):(o.weight||500)),0);
 if(o.anchor==='middle')cx=x-total/2;
 segs.forEach(s=>{const wgt=s.hi?(o.hiWeight||700):(o.weight||500);
  svg+=T(cx,y,s.t,{size,weight:wgt,fill:s.hi?(o.hiFill||state.accent):(o.fill||'#333')});
  cx+=tw(s.t,size,wgt)});
 return svg}
/* 섹션 헤더: ── 제목 ── */
function dashTitle(cx,y,text,size,fill){const w2=tw(text,size,800),dash=56,gap=22;
 return R(cx-w2/2-gap-dash,y-1.5,dash,3,1.5,state.accent)
 +T(cx,y,text,{size,weight:800,fill,anchor:'middle'})
 +R(cx+w2/2+gap,y-1.5,dash,3,1.5,state.accent)}
function chevronDown(cx,cy,up,color){const d=up?-1:1;
 return `<path d="M ${cx-7} ${cy-3*d} L ${cx} ${cy+4*d} L ${cx+7} ${cy-3*d}" fill="none" stroke="${color||'#8b95a5'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`}
function infoDot(cx,cy,r,color){return C(cx,cy,r,'none',` stroke="${color}" stroke-width="2"`)+T(cx,cy+.5,'!',{size:r*1.3,weight:900,fill:color,anchor:'middle'})}
/* 모니터 플레이스홀더 */
function monitorPh(cx,cy,w2){const h=w2*.5,x=cx-w2/2,y=cy-h/2;
 return R(x,y,w2,h,4,'#15161a')+R(x+5,y+5,w2-10,h-10,2,'url(#isScr)')
 +R(cx-w2*.03,y+h,w2*.06,h*.2,3,'#26272c')
 +`<path d="M ${cx-w2*.13} ${y+h*1.22} L ${cx+w2*.13} ${y+h*1.22} L ${cx+w2*.1} ${y+h*1.3} L ${cx-w2*.1} ${y+h*1.3} Z" fill="#1c1d21"/>`}

/* ---------- SVG 빌더 ---------- */
function buildSVG(){
 const A=state.accent,INK=state.ink,P=[];let y=0;
 /* 아이콘 준비 목록 */
 const needIcons=[['tabler:map-pin-filled',A],['tabler:user-filled',A]];
 state.steps.forEach(s=>{if(!s.img&&s.icon)needIcons.push([s.icon,A])});
 ensureIcons(needIcons);
 P.push(`<defs>
  <linearGradient id="isScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <linearGradient id="isHero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF1F7"/></linearGradient>
 </defs>`);

 /* ===== 히어로 ===== */
 const heroH=380;
 P.push(R(0,0,W,heroH,0,'url(#isHero)'));
 if(state.heroImage){
  const s=state.heroScale||1,bw=460*s,bh=340*s;
  P.push(`<image href="${state.heroImage}" x="${640-bw/2}" y="${heroH-14-bh}" width="${bw}" height="${bh}" preserveAspectRatio="xMidYMax meet"/>`);
 }else{
  P.push(monitorPh(640,190,330));
  P.push(T(640,330,'히어로 이미지를 올려주세요',{size:13,weight:600,fill:'#9aa3b0',anchor:'middle'}));
 }
 P.push(T(56,86,state.title1,{size:40,weight:900,fill:INK}));
 P.push(T(56,140,state.title2,{size:40,weight:900,fill:A}));
 P.push(segText(56,206,markSeg(state.sub1,'star'),18,{weight:500,fill:'#333'}));
 P.push(segText(56,236,markSeg(state.sub2,'star'),18,{weight:500,fill:'#333',hiWeight:800}));
 /* 배지 2개 */
 let bx=56;const by=292,bh2=46;
 [[state.badge1,'tabler:map-pin-filled'],[state.badge2,'tabler:user-filled']].forEach(([txt,ic])=>{
  if(!txt)return;
  const bw=tw(txt,15,700)+64;
  P.push(R(bx,by,bw,bh2,23,'#fff',` stroke="#E2E6EC" stroke-width="1.5"`));
  const d=iconReady(ic,A);
  if(d)P.push(`<image href="${d}" x="${bx+16}" y="${by+bh2/2-10}" width="20" height="20" preserveAspectRatio="xMidYMid meet"/>`);
  else P.push(C(bx+26,by+bh2/2,7,A));
  P.push(T(bx+44,by+bh2/2+.5,txt,{size:15,weight:700,fill:'#222'}));
  bx+=bw+12});
 y=heroH;

 /* ===== 섹션1: 구매 방법 ===== */
 const SEC_BG='#EEF1F5';
 const guideLines=wrap(state.guide,15,500,700);
 const rows=state.optRows.slice(0,4);
 const rowH=54,rowGap=12;
 const rightH=rows.length*(rowH+rowGap)+64+8;
 const innerH=Math.max(300,rightH+36);
 const card1H=112+guideLines.length*26+innerH+24+56+32;
 P.push(R(0,y,W,card1H+64,0,SEC_BG));
 const c1y=y+32;
 P.push(R(24,c1y,W-48,card1H,16,'#fff'));
 P.push(dashTitle(W/2,c1y+58,state.buyTitle,25,A));
 guideLines.forEach((l,i)=>{
  P.push(segText(W/2,c1y+108+i*26,markSeg(l,'quote'),15,{anchor:'middle',weight:500,fill:'#444',hiWeight:700})); });
 /* 내부 카드 */
 const iy=c1y+108+guideLines.length*26+18,ix=56,iw=W-112;
 P.push(R(ix,iy,iw,innerH,12,'#fff',` stroke="#E5E8EE" stroke-width="1.5"`));
 const splitX=ix+iw*.52;
 P.push(`<line x1="${splitX}" y1="${iy+16}" x2="${splitX}" y2="${iy+innerH-16}" stroke="#EDF0F4" stroke-width="1.5"/>`);
 /* 좌: 상품 예시 */
 P.push(R(ix+18,iy+18,74,28,6,A),T(ix+18+37,iy+32,'상품 예시',{size:13,weight:700,fill:'#fff',anchor:'middle'}));
 const pcx=ix+(splitX-ix)/2,pcy=iy+innerH/2-6;
 if(state.prodImage)P.push(`<image href="${state.prodImage}" x="${pcx-160}" y="${pcy-100}" width="320" height="190" preserveAspectRatio="xMidYMid meet"/>`);
 else P.push(monitorPh(pcx,pcy-14,230));
 P.push(T(pcx,iy+innerH-34,state.prodName,{size:21,weight:800,fill:INK,anchor:'middle'}));
 /* 우: 옵션 드롭다운 */
 const rx=splitX+24,rw=ix+iw-24-rx;
 let ry=iy+22;
 rows.forEach((r2,i)=>{const last=i===rows.length-1;
  P.push(R(rx,ry,rw,rowH,8,'#fff',` stroke="#DDE3EC" stroke-width="1.4"`));
  P.push(T(rx+18,ry+rowH/2+.5,r2,{size:15.5,weight:600,fill:'#333'}));
  P.push(chevronDown(rx+rw-24,ry+rowH/2,last,last?A:'#8b95a5'));
  ry+=rowH+rowGap});
 P.push(R(rx,ry,rw,64,8,'#F5F9FF',` stroke="${A}" stroke-width="1.8"`));
 P.push(T(rx+18,ry+32.5,state.optName,{size:15.5,weight:700,fill:INK}));
 P.push(T(rx+rw-18,ry+32.5,state.optPrice,{size:16,weight:800,fill:INK,anchor:'end'}));
 /* 안내바 */
 const bary=iy+innerH+22;
 P.push(R(56,bary,W-112,52,10,'#EEF4FF'));
 const segs=markSeg(state.infoBar,'star');
 const barTotal=segs.reduce((a,s)=>a+tw(s.t,15,s.hi?700:500),0)+34;
 P.push(infoDot(W/2-barTotal/2+11,bary+26,11,'#5b6a77'));
 P.push(segText(W/2-barTotal/2+34,bary+26.5,segs,15,{weight:500,fill:'#333',hiWeight:800}));
 y+=card1H+64;

 /* ===== 섹션2: 진행 절차 ===== */
 const steps=state.steps;
 const stepDescs=steps.map(s=>wrap(s.desc,13,500,176));
 const stepTitles=steps.map(s=>s.title.split('\n'));
 const maxT=Math.max(...stepTitles.map(t=>t.length)),maxD=Math.max(...stepDescs.map(d=>d.length));
 const s2H=96+70+118+maxT*26+10+maxD*20+56;
 P.push(R(0,y,W,s2H,0,'#fff'));
 P.push(dashTitle(W/2,y+62,'설치 서비스 진행 절차',25,INK));
 const margin=36,slotW=(W-margin*2)/steps.length;
 const icy=y+96+70;
 steps.forEach((st,i)=>{const cx=margin+slotW*i+slotW/2;
  P.push(C(cx,icy,52,'#EAF2FE'));
  const d=st.img||iconReady(st.icon,A);
  if(d)P.push(`<image href="${d}" x="${cx-27}" y="${icy-27}" width="54" height="54" preserveAspectRatio="xMidYMid meet"${st.img?` clip-path="circle(27px at 27px 27px)"`:''}/>`);
  else P.push(T(cx,icy,'…',{size:24,weight:800,fill:A,anchor:'middle'}));
  P.push(C(cx-44,icy-40,15,A),T(cx-44,icy-39.5,String(i+1).padStart(2,'0'),{size:11.5,weight:800,fill:'#fff',anchor:'middle'}));
  if(i<steps.length-1)P.push(`<path d="M ${margin+slotW*(i+1)-7} ${icy-8} L ${margin+slotW*(i+1)+3} ${icy} L ${margin+slotW*(i+1)-7} ${icy+8}" fill="none" stroke="#9db4d8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`);
  const ty=icy+52+40;
  stepTitles[i].forEach((l,j)=>P.push(T(cx,ty+j*26,l,{size:17.5,weight:800,fill:INK,anchor:'middle'})));
  const dy=ty+maxT*26+8;
  stepDescs[i].forEach((l,j)=>P.push(T(cx,dy+j*20,l,{size:13,weight:500,fill:'#666',anchor:'middle'})));
 });
 y+=s2H;

 /* ===== 유의사항 ===== */
 const nLines=[];state.noticeLines.forEach(l=>wrap(l,14.5,500,W-160).forEach((s,i)=>nLines.push({t:s,first:i===0})));
 const nBoxH=64+nLines.length*28+20;
 P.push(R(0,y,W,nBoxH+56,0,'#fff'));
 P.push(R(24,y,W-48,nBoxH,14,'#F2F4F7'));
 P.push(infoDot(60,y+38,11,A),T(82,y+38.5,'유의사항',{size:18,weight:800,fill:A}));
 nLines.forEach((l,i)=>{const ly=y+78+i*28;
  if(l.first)P.push(C(66,ly,2.5,'#555'));
  P.push(T(l.first?80:80,ly+.5,l.t,{size:14.5,weight:500,fill:'#444'}))});
 y+=nBoxH+40;

 return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Math.round(y)}" viewBox="0 0 ${W} ${Math.round(y)}">${P.join('')}</svg>`,H:Math.round(y)}}

/* ---------- 렌더/저장 ---------- */
let _rt=null;
function render(){clearTimeout(_rt);_rt=setTimeout(()=>{try{const{svg,H}=buildSVG();$('#preview').innerHTML=svg}catch(err){setStatus('미리보기 오류: '+err.message,true);console.error(err)}},60)}
function outputSVG(filename,svg){
 if(inFrame)parent.postMessage({pluginMessage:{type:'save-svg',filename,svg}},'*');
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
$('#saveBtn').textContent=inFrame?'에디터로 보내기':'SVG 다운로드';
$('#saveBtn').addEventListener('click',()=>{const{svg}=buildSVG();outputSVG('install-service.svg',svg);setStatus(inFrame?'에디터로 보냈습니다.':'SVG를 다운로드했습니다.')});
window.addEventListener('message',e=>{const m=e.data&&e.data.pluginMessage;if(m&&(m.type==='toast'||m.type==='error'))setStatus(m.message,m.type==='error')});

/* ---------- init ---------- */
renderStepEditors();
render();
</script>
</body>
